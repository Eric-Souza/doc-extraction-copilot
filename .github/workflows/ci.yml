name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The guard's parity test runs on these: they must match what review.ts flags today
      - run: npx tsx scripts/guard-fixtures.ts && git diff --exit-code guard/tests/fixtures.json
      - run: npx playwright install --with-deps chromium
      # Builds the app, then runs it against a scripted model, so no API key is needed
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guard
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The checks as Guardrails validators must flag the same fields as review.ts
      - run: uv run pytest -q
